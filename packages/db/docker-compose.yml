name: ponto-up-backend

services:
  postgres:
    image: postgres
    container_name: ponto-up-backend-postgres
    environment:
      POSTGRES_DB: ponto-up-backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ponto-up-backend_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ponto-up-backend_postgres_data:
